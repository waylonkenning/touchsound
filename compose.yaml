services:
  touchsound:
    build: .
    command:
      - python
      - /app/bridge.py
      - --speaker
      - ${SOUNDTOUCH_IP:?Set SOUNDTOUCH_IP}
      - --relay-url
      - ${RELAY_URL:?Set RELAY_URL to the Docker host LAN URL}
      - --control-token-file
      - /data/mobile-control.token
      - --speaker-name
      - ${SOUNDTOUCH_NAME:-SoundTouch speaker}
      - --event-log
      - /data/speaker-history.jsonl
    environment:
      TOUCHSOUND_STATIONS_OVERRIDES_FILE: /data/station-overrides.json
    ports:
      - "8765:8765"
    volumes:
      - ./stations.json:/app/stations.json:ro
      - touchsound_data:/data
    restart: unless-stopped

volumes:
  touchsound_data:
